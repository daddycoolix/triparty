name: collect
on:
  workflow_dispatch:
    inputs:
      job:
        description: "job name (jobs/<job>.json)"
        required: true
permissions:
  contents: write
concurrency:
  group: collect-${{ github.event.inputs.job }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: |
          rm -rf "data/${{ github.event.inputs.job }}"
          python3 collect/collect.py "jobs/${{ github.event.inputs.job }}.json" "data/${{ github.event.inputs.job }}"
      - name: Commit results
        run: |
          git config user.name "triparty-bot"
          git config user.email "triparty-bot@users.noreply.github.com"
          git add -A "data/${{ github.event.inputs.job }}"
          git commit -m "data: ${{ github.event.inputs.job }} $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
